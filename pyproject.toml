[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalplat"
version = "1.0.0"
description = "Evaluation for LLM systems that holds up: calibrated judges, paired statistics and a slice-aware release gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "scipy-stubs>=1.14"]

[project.scripts]
evalp = "evalplat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "NPY"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "PLR0917", "PLR0914", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
